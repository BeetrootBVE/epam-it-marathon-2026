name: Publish Angular to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/restaurant-frontend-app/**'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build production frontend
        working-directory: frontend/restaurant-frontend-app
        env:
          BACKEND_URL: ${{ vars.AQA_BASE_URL }}
          GITHUB_PAGES_BUILD: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build -- --base-href "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/restaurant-frontend-app/dist/restaurant-frontend-app/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
